<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubicación del dispositivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #1c1e23;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .dato {
      background: #292c33;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
    }

    .titulo {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 17px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📍 Ubicación de acceso</h1>

  <div class="dato">
    <div class="titulo">Ciudad / Municipio</div>
    <div class="valor" id="city">Cargando...</div>
  </div>

  <div class="dato">
    <div class="titulo">Región / Provincia</div>
    <div class="valor" id="region">Cargando...</div>
  </div>

  <div class="dato">
    <div class="titulo">País</div>
    <div class="valor" id="country">Cargando...</div>
  </div>

  <div class="dato">
    <div class="titulo">IP de conexión</div>
    <div class="valor" id="ip">Cargando...</div>
  </div>

</div>

<script>
async function obtenerUbicacionAproximada() {
  try {
    const respuesta = await fetch('https://ipapi.co/json/');
    
    if (!respuesta.ok) {
      throw new Error("No se pudo conectar con el servicio");
    }

    const datos = await respuesta.json();

    document.getElementById("city").textContent = datos.city || "No disponible";
    document.getElementById("region").textContent = datos.region || "No disponible";
    document.getElementById("country").textContent = datos.country_name || "No disponible";
    document.getElementById("ip").textContent = datos.ip || "No disponible";

  } catch (error) {
    document.getElementById("city").textContent = "Error al detectar";
    document.getElementById("region").textContent = "Error al detectar";
    document.getElementById("country").textContent = "Error al detectar";
    document.getElementById("ip").textContent = "Error al detectar";
    console.error("Detalle del error:", error);
  }
}

obtenerUbicacionAproximada();
</script>

</body>
</html>
